<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050812">
<title>SpiderKit // Payloads</title>
<link rel="icon" href="../ui/spider-icon-runtime.png" type="image/png">
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:#050812; color:#edf2ff; }
  body {
    padding:18px 20px 30px; overflow-y:auto;
    background:linear-gradient(145deg,#080c18,#111b31 58%,#080b14);
    font:14px/1.35 ui-monospace,Consolas,monospace;
  }
  #folder { display:block; width:92%; max-width:980px; margin:0 auto; }
  #headerTable { width:100%; margin:0 0 14px; border-collapse:collapse; border-bottom:1px solid #303b55; }
  #headerTable td { height:70px; padding:5px 0 10px; vertical-align:middle; }
  #logoCell { width:70px; }
  #logo { display:block; width:58px; height:58px; padding:3px; border:1px solid #a84059; border-radius:50%; background:#fff; }
  #titleCell p { margin:0 0 5px; color:#ff5777; font-size:9px; font-weight:bold; letter-spacing:.16em; }
  h1 { margin:0; font:900 27px/1 system-ui,sans-serif; letter-spacing:-.025em; }
  #bridge {
    width:180px; padding:8px!important; border:1px solid #34415f;
    color:#8f9bb3; background:#0a1020; text-align:center;
    font-size:8px; font-weight:bold; letter-spacing:.08em;
  }
  #bridge.online { color:#94f0c0; border-color:#2d7b5b; background:#0c2a20; }
  #files { display:block!important; width:100%; height:auto; }
  .file {
    display:block!important; visibility:visible!important; width:100%; height:54px;
    min-height:54px; margin:0 0 7px; padding:0 14px; overflow:hidden;
    border:1px solid #2c3851; border-radius:9px; color:#dce5f7;
    background:#0a1020; text-align:left; white-space:nowrap;
    font:800 12px/1 ui-monospace,Consolas,monospace;
    -webkit-appearance:none; appearance:none;
  }
  .file:focus { outline:3px solid #fff; outline-offset:1px; border-color:#fff; color:#fff; background:#451124; }
  body.busy .file { opacity:.35; }
  body.busy .file.active { opacity:1; }
  .file[data-state="sending"] { color:#b6d2ff; border-color:#397cf1; background:#101f3f; }
  .file[data-state="sent"] { color:#a2f0c7; border-color:#2d8a62; background:#0d281f; }
  .file[data-state="failed"] { color:#ff9caf; border-color:#e83258; background:#32101a; }
  #message {
    min-height:36px; margin:13px 0 0; padding:10px 12px; color:#8f9bb1;
    border:1px solid #252f45; border-radius:8px; background:#070b15;
    font-size:9px; letter-spacing:.06em;
  }
  #message.error { color:#ff9caf; border-color:#7d263b; }
  #system { margin:9px 2px 0; color:#59657c; font-size:8px; letter-spacing:.06em; }
  #credits { margin:12px 2px 0; padding-top:10px; border-top:1px solid #252f45; color:#657188; font-size:8px; font-weight:bold; letter-spacing:.07em; }
  #credits span { display:block; margin-top:4px; }
  #credits strong { color:#aab5ca; }
  #credits .zero { color:#ff5777; }
  @media(max-width:700px) {
    body { padding:12px 10px 24px; }
    #folder { width:96%; }
    #bridge { display:none; }
    .file { padding-left:10px; font-size:10px; }
  }
  @media(max-height:650px) {
    body { padding-top:8px; }
    #headerTable { margin-bottom:8px; }
    #headerTable td { height:56px; padding-bottom:6px; }
    #logoCell { width:57px; }
    #logo { width:48px; height:48px; }
    h1 { font-size:22px; }
    .file { height:44px; min-height:44px; margin-bottom:5px; }
    #message { margin-top:8px; }
  }
</style>
</head>
<body tabindex="-1">
<main id="folder">
  <table id="headerTable" aria-label="Payload directory header">
    <tr>
      <td id="logoCell"><img id="logo" src="../ui/spider-icon-runtime.png" alt=""></td>
      <td id="titleCell"><p>ELF LOADER // /PAYLOADS/</p><h1>PAYLOAD DIRECTORY</h1></td>
      <td id="bridge">DIRECTORY PREVIEW</td>
    </tr>
  </table>

  <section id="files" aria-label="Selectable ELF payloads">
    <button class="file" type="button" data-code="FTP" data-size="188 KiB" data-name="ftpsrv-ps5.elf" data-state="default">FTP // ftpsrv-ps5.elf // 188 KiB // READY</button>
    <button class="file" type="button" data-code="GDB" data-size="171 KiB" data-name="gdbsrv-ps5.elf" data-state="default">GDB // gdbsrv-ps5.elf // 171 KiB // READY</button>
    <button class="file" type="button" data-code="LOG" data-size="133 KiB" data-name="klogsrv-ps5.elf" data-state="default">LOG // klogsrv-ps5.elf // 133 KiB // READY</button>
    <button class="file" type="button" data-code="KST" data-size="v1.09 OFFICIAL" data-name="kstuff.elf" data-state="default">KST // kstuff.elf // v1.09 OFFICIAL // READY</button>
    <button class="file" type="button" data-code="SHL" data-size="964 KiB" data-name="shsrv-ps5.elf" data-state="default">SHL // shsrv-ps5.elf // 964 KiB // READY</button>
    <button class="file" type="button" data-code="WEB" data-size="1.6 MiB" data-name="websrv-ps5.elf" data-state="default">WEB // websrv-ps5.elf // 1.6 MiB // READY</button>
    <button class="file" type="button" data-code="SHD" data-size="1.4 MiB" data-name="shadowmountplus.elf" data-state="default">SHD // shadowmountplus.elf // 1.4 MiB // READY</button>
    <button class="file" type="button" data-code="CHT" data-size="9.1 MiB" data-name="cheatrunner.elf" data-state="default">CHT // cheatrunner.elf // 9.1 MiB // READY</button>
    <button class="file" type="button" data-code="BPK" data-size="97 KiB" data-name="ps5-backpork.elf" data-state="default">BPK // ps5-backpork.elf // 97 KiB // READY</button>
    <button class="file" type="button" data-code="PLD" data-size="2.3 MiB" data-name="pldmgr_v0.5.1.elf" data-state="default">PLD // pldmgr_v0.5.1.elf // 2.3 MiB // READY</button>
  </section>

  <div id="message" aria-live="polite">STANDALONE DIRECTORY PREVIEW // UI 40</div>
  <div id="system">SYSTEM COMPONENTS (ELFLDR / KEXP) ARE NOT EXPOSED AS USER PAYLOADS.</div>
  <footer id="credits">EXPLOIT RESEARCH // <strong>SONIC ISO</strong> + <strong>JORDY</strong><span>SPIDER EXPERIENCE // <strong class="zero">zer0day</strong></span></footer>
</main>

<script>
(function () {
    var files = document.getElementsByClassName("file");
    var bridge = document.getElementById("bridge");
    var message = document.getElementById("message");
    var runtime = false;

    try {
        runtime = window.parent !== window
            && typeof window.parent.spiderKitSelectPayload === "function";
    } catch (e) { runtime = false; }

    if (runtime) {
        bridge.className = "online";
        bridge.textContent = "ELF LOADER CONNECTED";
    } else {
        message.className = "error";
        message.textContent = "DIRECTORY PREVIEW ONLY // START BRAND NEW JAILBREAK BEFORE SELECTING A FILE.";
    }

    function findFile(name) {
        for (var i = 0; i < files.length; ++i)
            if (files[i].getAttribute("data-name") === name) return files[i];
        return null;
    }

    function renderFile(file, state) {
        var labels = { "default":"READY", "sending":"SENDING", "sent":"SENT", "failed":"FAILED" };
        file.textContent = file.getAttribute("data-code") + " // "
            + file.getAttribute("data-name") + " // "
            + file.getAttribute("data-size") + " // "
            + (labels[state] || String(state).toUpperCase());
    }

    function setFileState(file, state) {
        file.setAttribute("data-state", state);
        renderFile(file, state);
    }

    window.spiderKitPayloadState = function (name, state, detail) {
        if (name === "*") {
            if (state === "busy") {
                document.body.className = "busy";
                for (var i = 0; i < files.length; ++i)
                    files[i].className = files[i].getAttribute("data-name") === detail
                        ? "file active" : "file";
            } else if (state === "blocked") {
                document.body.className = "busy";
                message.className = "error";
                message.textContent = "SENDER BLOCKED // REBOOT REQUIRED // " + detail;
            } else {
                document.body.className = "";
                for (var j = 0; j < files.length; ++j) files[j].className = "file";
            }
            return;
        }
        var file = findFile(name);
        if (!file) return;
        setFileState(file, state);
        if (state === "sending") {
            message.className = "";
            message.textContent = "SENDING " + name + " TO 127.0.0.1:9021...";
        } else if (state === "sent") {
            message.className = "";
            message.textContent = "SENT // " + name + (detail ? " // " + detail : "");
        } else if (state === "failed") {
            message.className = "error";
            message.textContent = "FAILED // " + name + (detail ? " // " + detail : "");
        }
    };

    for (var i = 0; i < files.length; ++i) {
        files[i].onclick = function (event) {
            if (event && event.preventDefault) event.preventDefault();
            var name = this.getAttribute("data-name");
            if (!runtime) {
                message.className = "error";
                message.textContent = "START BRAND NEW JAILBREAK FIRST // THIS PAGE ALONE CANNOT EXECUTE " + name;
                return false;
            }
            if (document.body.className === "busy") return false;
            setFileState(this, "sending");
            try {
                if (!window.parent.spiderKitSelectPayload(name))
                    setFileState(this, "failed");
            } catch (error) {
                setFileState(this, "failed");
                message.className = "error";
                message.textContent = "FAILED // " + (error && error.message ? error.message : error);
            }
            return false;
        };
    }

    document.addEventListener("keydown", function (event) {
        var key = event.key || "";
        var current = -1;
        for (var i = 0; i < files.length; ++i)
            if (files[i] === document.activeElement) current = i;

        if ((key === "Enter" || key === " ") && current < 0 && files.length) {
            if (event.preventDefault) event.preventDefault();
            message.className = "";
            message.textContent = "PRESS ↓ TO SELECT A PAYLOAD, THEN × TO SEND.";
            return;
        }
        if (key !== "ArrowUp" && key !== "ArrowDown" && key !== "Home" && key !== "End") return;

        var next = current;
        if (key === "ArrowDown") next = current < 0 ? 0 : Math.min(files.length - 1, current + 1);
        if (key === "ArrowUp") next = current < 0 ? files.length - 1 : Math.max(0, current - 1);
        if (key === "Home") next = 0;
        if (key === "End") next = files.length - 1;
        if (event.preventDefault) event.preventDefault();
        try { files[next].focus(); } catch (e) { }
    });

    window.setTimeout(function () {
        try { document.body.focus(); } catch (e) { }
    }, 50);
})();
</script>
</body>
</html>
